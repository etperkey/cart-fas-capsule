metadata_version: 1
name: >
  Harnessing Fas/FasL-dependent bystander killing to mitigate antigen escape
  in CAR-T therapy — bulk RNA-seq analysis capsule (Lin, Chorazeczewski et al.,
  Blood Cancer Discovery BCD-26-0329)
description: >
  Reproducible analysis capsule prepared for revision submission to Blood
  Cancer Discovery (manuscript BCD-26-0329, Lin, Chorazeczewski et al.) in
  response to the journal's Code Ocean requirement. It reproduces the bulk
  RNA-seq analyses in the paper on Fas/FasL-dependent bystander killing by
  CD19 CAR T cells in large B-cell lymphoma (co-senior authors J. Kline,
  UChicago, and J. D. Brody, Mount Sinai; corresponding: J. D. Brody).
  The capsule reproduces Figure 1A–I and Supplementary Figure 1A–F from
  normalized intermediates: Stanford (dbGaP phs003145.v1.p1) and ZUMA-1 (Kite
  Pharma) axi-cel cohorts batch-combined via limma `removeBatchEffect`, and
  the NCI R-CHOP comparator cohort (dbGaP phs001444.v2.p1) built from GDC
  STAR counts. Analyses include DESeq2 variance-stabilizing transformation,
  GSVA scoring of the Death Receptor Signature (Singh 2020), survminer
  `surv_cutpoint` max-stat Kaplan–Meier survival for CD19/FAS/DRS, and
  Kaplan–Meier on B-cell-resolved CD19/FAS expression inferred from
  CIBERSORTx High-Resolution deconvolution (fractions and gene expression
  profiles shipped as inputs).
  The raw dbGaP counts are not redistributed; the capsule ships the
  variance-stabilized matrices and clinical metadata as a restricted data
  asset. Users with dbGaP phs001444 and phs003145 access can regenerate the
  intermediates from the included prepare scripts.
